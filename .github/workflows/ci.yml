name: Release on tag

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_MANAGED_PYTHON: "true"

jobs:
  test:
    if: github.repository == 'jonalbr/heat-sheet-pdf-highlighter' && github.actor == 'jonalbr' && github.triggering_actor == 'jonalbr'
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Python
        shell: pwsh
        run: uv python install
      - name: Validate lockfile
        shell: pwsh
        run: uv lock --locked
      - name: Validate generated version artifacts
        shell: pwsh
        run: uv run --locked python sync_version.py --check
      - name: Validate release version metadata
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}" -replace '^v', ''

          $generated = Select-String -Path 'src/_version.py' -Pattern '^VERSION_STR\s*=\s*"([^"]+)"$'
          $actual = if ($generated) { $generated.Matches[0].Groups[1].Value } else { $null }
          if ($actual -ne $expected) {
            Write-Error "Tag version '$expected' does not match generated display version '$actual'."
            exit 1
          }
      - name: Install dependencies
        shell: pwsh
        run: uv sync --locked --all-groups
      - name: Run tests
        shell: pwsh
        run: uv run --locked pytest -vv -o faulthandler_timeout=60

  build_installer:
    needs: test
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Python
        shell: pwsh
        run: uv python install
      - name: Validate lockfile
        shell: pwsh
        run: uv lock --locked
      - name: Install dependencies
        shell: pwsh
        run: uv sync --locked --all-groups
      - name: Install Inno Setup (winget → direct download → choco)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Get-InnoVersion {
            try {
              $path = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
              if (-not $path) {
                $path = (Get-ChildItem "C:/Program Files (x86)/Inno Setup*" -Recurse -Filter iscc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              }
              if ($path) {
                return (Get-Item $path).VersionInfo.ProductVersion
              }
            } catch {}
            return $null
          }

          $targetVersion = [Version]'6.7.1.0'
          $installed = $null
          $raw = Get-InnoVersion
          if ($raw) {
            try { $installed = [Version]$raw } catch {}
          }
          if ($installed -and $installed -ge $targetVersion) {
            Write-Output "✅ Inno Setup $($installed) already installed."
            return
          }

          # Try winget if available (often missing on Windows Server images)
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if ($winget) {
            Write-Output "✅ winget found. Installing/Upgrading Inno Setup..."
            winget install --id JRSoftware.InnoSetup -e -s winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -eq 0) {
              Write-Output "✅ winget succeeded"
              return
            } else {
              Write-Output "⚠️ winget failed with exit code $LASTEXITCODE; will try direct download."
            }
          } else {
            Write-Output "ℹ️ winget not available on this runner; trying direct download."
          }

          # Direct download (static URL for 6.7.1)
          try {
            Write-Output "⬇️ Downloading Inno Setup 6.7.1 (static URL)..."
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
            $installer = 'innosetup-6.7.1.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            $proc = Start-Process -FilePath ".\$installer" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            if ($proc.ExitCode -eq 0) {
              Write-Output "✅ direct download install succeeded"
              return
            } else {
              Write-Output "⚠️ direct download install failed with exit code $($proc.ExitCode)."
            }
          } catch {
            Write-Output "⚠️ direct download failed: $($_.Exception.Message)"
          }

          # Chocolatey fallback (upgrade to latest available)
          Write-Output "🍫 Using Chocolatey to upgrade..."
          choco upgrade innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          AppId: ${{ secrets.INNO_APP_ID }}
        run: uv run python build_windows_installer.py
      - name: Ensure SHA256 exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'heat_sheet_pdf_highlighter_installer.exe.sha256')) {
            if (Test-Path 'heat_sheet_pdf_highlighter_installer.exe') {
              $h = (Get-FileHash 'heat_sheet_pdf_highlighter_installer.exe' -Algorithm SHA256).Hash.ToLower()
              "$h  heat_sheet_pdf_highlighter_installer.exe" | Out-File -Encoding ascii -NoNewline 'heat_sheet_pdf_highlighter_installer.exe.sha256'
            }
          }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            heat_sheet_pdf_highlighter_installer.exe
            heat_sheet_pdf_highlighter_installer.exe.sha256

  generate_notes:
    needs: test
    if: github.repository == 'jonalbr/heat-sheet-pdf-highlighter' && github.actor == 'jonalbr' && github.triggering_actor == 'jonalbr'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Python
        run: uv python install
      - name: Install release-note dependencies
        run: uv sync --locked --group dev
      - name: Generate release notes with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python generate_release_notes.py --to "$RELEASE_TAG" --output release_notes.md
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release_notes
          if-no-files-found: error
          path: |
            release_notes.md
            release_notes.evidence.json

  release:
    runs-on: ubuntu-latest
    needs: [build_installer, generate_notes]
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: installer
          path: .
      - name: Download release notes artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: release_notes
          path: .
      - name: Create GitHub Release from tag
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
          files: |
            heat_sheet_pdf_highlighter_installer.exe
            heat_sheet_pdf_highlighter_installer.exe.sha256
